# This is the default configuration for `slurmon`

[footer]
show = true

[job_view]
show = true
loop_after_end = false
refresh_interval = 5   # seconds between squeue refreshes
split_fraction = 0.5   # 0.05 - 0.95, fraction of terminal width for the job list pane
sort_by = "none"       # none | id | name | state | time
sort_descending = false

# Columns shown in the job list, in order. Available keys:
#   id, name, state, state_compact, user, uid, group, gid, account,
#   partition, qos, priority, nice, time, time_limit, time_left,
#   submit_time, start_time, end_time, nodes, nodelist, reason,
#   min_cpus, cpus, min_memory, tres, features, dependency,
#   reservation, wckey, licenses, command, workdir, exec_host,
#   array_id, array_task, sockets, cores, threads, sct, comment,
#   exit_code (history only)
columns = ["id", "name", "state", "time"]

[log_view]
show = true
error_first = false    # show stderr first instead of stdout

[detail_view]
show = true
# Fields shown in the details pane, in order. Same key set as
# job_view.columns above (id, name, state, user, time, nodes, nodelist,
# partition, qos, priority, time_limit, submit_time, start_time, end_time,
# cpus, min_memory, tres, workdir, reason, exit_code, ...).
columns = ["id", "name", "state", "user", "time", "nodes", "nodelist"]
